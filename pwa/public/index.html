<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StreetWalker">
  <meta name="theme-color" content="#22c55e">
  <title>NYC Street Walker</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- ═══════════════════════════════ SIGN IN ═══════════════════════════════ -->
<div id="signin-screen" class="screen active">
  <div class="signin-hero">
    <div class="signin-icon">🗺️</div>
    <h1>NYC Street Walker</h1>
    <p>Track every street you've walked<br>across New York City</p>
  </div>
  <div class="signin-form">
    <input id="signin-name" type="text" placeholder="Your name" maxlength="30" autocomplete="name">
    <button id="signin-btn" class="btn-primary">Get Started</button>
    <p class="signin-hint">Already have an ID? <a href="#" id="show-login">Sign in with ID</a></p>
  </div>
  <div id="login-form" class="signin-form hidden">
    <input id="login-id" type="text" placeholder="Paste your User ID" style="font-family:monospace;font-size:13px">
    <button id="login-btn" class="btn-primary">Sign In</button>
  </div>
</div>

<!-- ═══════════════════════════════ MAIN APP ══════════════════════════════ -->
<div id="app" class="screen hidden">

  <!-- TAB: MAP -->
  <div id="tab-map" class="tab-content active">
    <div id="map"></div>

    <!-- Tracking bar -->
    <div id="tracking-bar" class="tracking-bar hidden">
      <span class="recording-dot"></span>
      <span id="track-duration">0:00</span>
      <span class="sep">·</span>
      <span id="track-distance">0.0 km</span>
      <span class="sep">·</span>
      <span id="track-streets">0 streets</span>
    </div>

    <!-- Start/Stop button -->
    <button id="walk-btn" class="walk-btn">
      <span id="walk-icon">🚶</span>
      <span id="walk-label">Start Walk</span>
    </button>

    <!-- Neighborhood load button -->
    <div id="map-hood-panel" class="map-hood-panel hidden">
      <span id="map-hood-name"></span>
      <button id="map-hood-load" class="btn-small">Load Streets</button>
    </div>
  </div>

  <!-- TAB: NEIGHBORHOODS -->
  <div id="tab-neighborhoods" class="tab-content hidden">
    <div class="tab-header">
      <h2>Neighborhoods</h2>
      <select id="borough-filter">
        <option value="">All Boroughs</option>
        <option value="Manhattan">Manhattan</option>
        <option value="Brooklyn">Brooklyn</option>
        <option value="Queens">Queens</option>
        <option value="The Bronx">The Bronx</option>
        <option value="Staten Island">Staten Island</option>
      </select>
    </div>
    <div id="neighborhood-list" class="list-container"></div>
  </div>

  <!-- TAB: NEIGHBORHOOD DETAIL (hidden panel) -->
  <div id="tab-hood-detail" class="tab-content hidden">
    <div class="detail-header">
      <button class="back-btn" onclick="showNeighborhoods()">← Back</button>
      <h2 id="detail-hood-name"></h2>
    </div>
    <div class="progress-summary" id="detail-summary"></div>
    <div class="filter-tabs" id="street-filter-tabs">
      <button class="filter-tab active" data-filter="all" onclick="filterStreets('all',this)">All</button>
      <button class="filter-tab" data-filter="walked" onclick="filterStreets('walked',this)">Walked</button>
      <button class="filter-tab" data-filter="unwalked" onclick="filterStreets('unwalked',this)">Not Walked</button>
    </div>
    <div id="street-list" class="list-container"></div>
  </div>

  <!-- TAB: FRIENDS -->
  <div id="tab-friends" class="tab-content hidden">
    <div class="tab-header">
      <h2>Friends</h2>
      <button class="btn-small" onclick="showAddFriend()">+ Add</button>
    </div>
    <div id="friends-list" class="list-container"></div>

    <!-- Add friend panel -->
    <div id="add-friend-panel" class="bottom-panel hidden">
      <h3>Add a Friend</h3>
      <p class="hint">Share your ID with friends, or paste theirs below.</p>
      <div class="your-id-box">
        <label>Your ID</label>
        <div class="id-row">
          <code id="your-user-id"></code>
          <button onclick="copyMyID()" class="btn-small">Copy</button>
        </div>
      </div>
      <input id="friend-id-input" type="text" placeholder="Paste friend's ID" style="font-family:monospace;font-size:13px">
      <button onclick="addFriendByID()" class="btn-primary">Add Friend</button>
      <button onclick="hideAddFriend()" class="btn-ghost">Cancel</button>
    </div>
  </div>

  <!-- TAB: PROFILE -->
  <div id="tab-profile" class="tab-content hidden">
    <div class="profile-header">
      <div id="profile-avatar" class="avatar-large"></div>
      <div>
        <h2 id="profile-name"></h2>
        <p id="profile-joined" class="hint"></p>
      </div>
    </div>
    <div class="stats-grid" id="profile-stats"></div>
    <div class="borough-breakdown" id="borough-breakdown"></div>
    <div class="profile-actions">
      <div class="your-id-box">
        <label>Your User ID (share with friends)</label>
        <div class="id-row">
          <code id="profile-user-id"></code>
          <button onclick="copyMyID()" class="btn-small">Copy</button>
        </div>
      </div>
      <button onclick="signOut()" class="btn-danger">Sign Out</button>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('map',this)">
      <span>🗺️</span><span>Map</span>
    </button>
    <button class="nav-btn" onclick="switchTab('neighborhoods',this)">
      <span>🏙️</span><span>Neighborhoods</span>
    </button>
    <button class="nav-btn" onclick="switchTab('friends',this)">
      <span>👥</span><span>Friends</span>
    </button>
    <button class="nav-btn" onclick="switchTab('profile',this)">
      <span>👤</span><span>Profile</span>
    </button>
  </nav>
</div>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<!-- Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/neighborhoods.js"></script>
<script src="/js/streets.js"></script>
<script src="/js/social.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
